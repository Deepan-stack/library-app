<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BorrowHub — Library Management</title>
<style>
  :root {
    --ink:#20241F; --sub:#5B6158; --bg:#F5F6F2; --surface:#FFFFFF; --line:#E4E6DE;
    --accent:#0F6E56; --accent-soft:#E1F0EA;
    --gold:#B4790A; --gold-soft:#FBF0DC;
    --red:#B23B3B; --red-soft:#FAEAEA;
    --blue:#2C5C8A; --blue-soft:#E7EFF6;
    --display: 'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: var(--sans); background: var(--bg); color: var(--ink); }
  button { font-family: var(--sans); cursor: pointer; }
  input, select { font-family: var(--sans); }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 22px;
    border-bottom:1px solid var(--line); background:var(--surface); }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; }
  .brand-name { font-family:var(--display); font-size:17px; font-weight:700; }
  .roles { display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px; }
  .role-btn { border:none; border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:600;
    background:transparent; color:var(--sub); }
  .role-btn.active { background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,0.08); }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--accent); }

  .layout { display:flex; }
  .sidebar { width:210px; border-right:1px solid var(--line); background:var(--surface);
    padding:18px 12px; min-height:calc(100vh - 61px); }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
    cursor:pointer; margin-bottom:2px; color:var(--sub); font-size:13.5px; font-weight:500; }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-item:hover:not(.active) { background:#F2F3EE; }

  .main { flex:1; padding:24px 28px; }
  h2.page-title { margin:0 0 18px; font-family:var(--display); font-size:24px; }

  .kpis { display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    display:flex; align-items:center; gap:14px; flex:1; min-width:170px; }
  .kpi .icon { width:42px; height:42px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; font-size:18px; }
  .kpi .value { font-size:22px; font-weight:700; font-family:var(--display); }
  .kpi .label { font-size:12.5px; color:var(--sub); margin-top:2px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .card h3 { margin:0 0 14px; font-family:var(--display); font-size:15.5px; font-weight:600; }

  .badge { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; letter-spacing:0.2px; }
  .badge.ok { background:var(--accent-soft); color:var(--accent); }
  .badge.warn { background:var(--gold-soft); color:var(--gold); }
  .badge.danger { background:var(--red-soft); color:var(--red); }

  .catalog-toolbar { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
  .subtle { color:var(--sub); font-size:13px; margin:4px 0 0; }
  .btn-primary { display:flex; align-items:center; gap:6px; background:var(--accent); color:#fff;
    border:none; border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600; }
  .filters { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search-box { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:8px 12px; flex:1 1 240px; }
  .search-box input { border:none; outline:none; font-size:13.5px; flex:1; }
  select.cat-filter { border:1px solid var(--line); border-radius:9px; padding:8px 12px; font-size:13.5px;
    background:var(--surface); color:var(--ink); }

  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th { padding:12px 16px; color:var(--sub); font-weight:600; font-size:11.5px; text-transform:uppercase;
    letter-spacing:0.4px; text-align:left; background:#FAFBF7; }
  tbody td { padding:10px 16px; border-top:1px solid var(--line); vertical-align:middle; }
  tbody tr:nth-child(even) td { background:#FCFDFA; }
  .cover { width:34px; height:44px; border-radius:4px; display:flex; align-items:center; justify-content:center;
    box-shadow: inset -6px 0 0 rgba(0,0,0,0.12); color:#fff; font-size:10px; font-weight:700; font-family:var(--display); }
  .book-title { font-weight:600; }
  .book-author { color:var(--sub); font-size:12px; }
  .isbn { color:var(--sub); font-family:monospace; font-size:12px; }
  .row-actions { text-align:right; white-space:nowrap; }
  .icon-btn { background:none; border:none; padding:4px; margin-left:8px; font-size:15px; }
  .icon-btn.del { color:var(--red); }
  .icon-btn.edit { color:var(--sub); }
  .reserve-btn { padding:6px 12px; border-radius:7px; border:none; font-size:12.5px; font-weight:600; }
  .reserve-btn.enabled { background:var(--accent-soft); color:var(--accent); }
  .reserve-btn.disabled { background:#EFF0EA; color:var(--sub); cursor:not-allowed; }

  .empty-row td { text-align:center; padding:30px; color:var(--sub); }

  .modal-overlay { position:fixed; inset:0; background:rgba(32,36,31,0.45); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:var(--surface); border-radius:16px; width:440px; max-width:100%; padding:26px; }
  .modal.small { width:360px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-head h3 { margin:0; font-family:var(--display); font-size:20px; }
  .modal-head .close { background:none; border:none; font-size:18px; color:var(--sub); }
  .field { margin-bottom:12px; }
  .field label { font-size:12px; color:var(--sub); text-transform:capitalize; display:block; margin-bottom:4px; }
  .field input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); font-size:14px; }
  .field-row { display:flex; gap:12px; margin-bottom:8px; }
  .field-row .field { flex:1; margin-bottom:0; }
  .error-text { color:var(--red); font-size:12.5px; margin-top:6px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .btn-secondary { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff;
    color:var(--ink); font-size:13.5px; }
  .btn-danger { padding:9px 16px; border-radius:8px; border:none; background:var(--red); color:#fff;
    font-size:13.5px; font-weight:600; }
  .btn-confirm { padding:9px 16px; border-radius:8px; border:none; background:var(--accent); color:#fff;
    font-size:13.5px; font-weight:600; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s; }
  .toast.show { opacity:1; }

  .empty-state { text-align:center; padding:50px 20px; }
  .empty-state .title { font-family:var(--display); font-size:18px; margin-bottom:6px; }
  .empty-state .body { font-size:13px; color:var(--sub); }

  canvas#trendChart { width:100%; height:220px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">📚</div>
    <div class="brand-name">BorrowHub</div>
  </div>
  <div class="roles" id="roleSwitch"></div>
  <div class="avatar" id="avatarInitials">AD</div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
// ---------------- Data ----------------
let books = [
  { id:1, title:"Clean Code", author:"Robert C. Martin", isbn:"9780132350884", category:"Software Engineering", copies:4, available:2, cover:"#0F6E56" },
  { id:2, title:"The Pragmatic Programmer", author:"David Thomas", isbn:"9780135957059", category:"Software Engineering", copies:3, available:0, cover:"#B4790A" },
  { id:3, title:"Sapiens", author:"Yuval Noah Harari", isbn:"9780062316097", category:"History", copies:5, available:5, cover:"#2C5C8A" },
  { id:4, title:"Atomic Habits", author:"James Clear", isbn:"9780735211292", category:"Self-Help", copies:6, available:1, cover:"#B23B3B" },
  { id:5, title:"Design Patterns", author:"Erich Gamma", isbn:"9780201633610", category:"Software Engineering", copies:2, available:2, cover:"#0F6E56" },
  { id:6, title:"Educated", author:"Tara Westover", isbn:"9780399590504", category:"Memoir", copies:3, available:0, cover:"#6B5B95" },
  { id:7, title:"Introduction to Algorithms", author:"Thomas Cormen", isbn:"9780262033848", category:"Computer Science", copies:4, available:3, cover:"#0F6E56" },
  { id:8, title:"Dune", author:"Frank Herbert", isbn:"9780441172719", category:"Fiction", copies:5, available:2, cover:"#B4790A" },
];

const trend = [["Mon",12],["Tue",18],["Wed",9],["Thu",22],["Fri",15],["Sat",6],["Sun",4]];
const overdueList = [
  { member:"Aravind K.", book:"The Pragmatic Programmer", due:"Aug 18", days:7 },
  { member:"Priya S.", book:"Educated", due:"Aug 20", days:5 },
  { member:"Rahul M.", book:"Atomic Habits", due:"Aug 22", days:3 },
];
const myLoans = [
  { title:"Clean Code", due:"Sep 02", status:"ok" },
  { title:"Design Patterns", due:"Aug 24", status:"overdue" },
];

const NAV = {
  admin: [["overview","Dashboard"],["catalog","Catalog"],["users","Users"],["reports","Reports"],["settings","Settings"]],
  librarian: [["overview","Dashboard"],["catalog","Catalog"],["issue","Issue / Return"],["members","Members"],["overdue","Overdue & Fines"]],
  student: [["overview","Dashboard"],["catalog","Browse catalog"],["myBooks","My books"],["profile","Profile"]],
};
const ROLE_LABEL = { admin:"Admin", librarian:"Librarian", student:"Student" };
const PAGE_LABEL = { users:"Users", reports:"Reports", settings:"Settings", issue:"Issue / Return",
  members:"Members", overdue:"Overdue & Fines", myBooks:"My books", profile:"Profile" };

// ---------------- State ----------------
let state = { role:"admin", page:"overview", query:"", category:"All", modal:null, editingBook:null, deletingBook:null };

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function initials(t){ return t.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2200);
}

// ---------------- Render: shell ----------------
function renderTopbar(){
  const rs = document.getElementById("roleSwitch");
  rs.innerHTML = Object.keys(ROLE_LABEL).map(r =>
    `<button class="role-btn ${state.role===r?'active':''}" onclick="changeRole('${r}')">${ROLE_LABEL[r]}</button>`
  ).join("");
  document.getElementById("avatarInitials").textContent =
    state.role==="admin" ? "AD" : state.role==="librarian" ? "LB" : "ST";
}

function renderSidebar(){
  const sb = document.getElementById("sidebar");
  sb.innerHTML = NAV[state.role].map(([key,label]) =>
    `<div class="nav-item ${state.page===key?'active':''}" onclick="changePage('${key}')">${label}</div>`
  ).join("");
}

function changeRole(r){ state.role=r; state.page="overview"; renderAll(); }
function changePage(p){ state.page=p; renderAll(); }

function renderAll(){
  renderTopbar();
  renderSidebar();
  renderMain();
}

// ---------------- Render: main router ----------------
function renderMain(){
  const main = document.getElementById("main");
  if (state.page === "catalog") { main.innerHTML = catalogHTML(); attachCatalogEvents(); return; }
  if (state.page === "overview") {
    if (state.role==="admin") { main.innerHTML = adminOverviewHTML(); drawTrendChart(); return; }
    if (state.role==="librarian") { main.innerHTML = librarianOverviewHTML(); return; }
    main.innerHTML = studentOverviewHTML(); return;
  }
  main.innerHTML = comingSoonHTML(PAGE_LABEL[state.page] || state.page);
}

// ---------------- KPI helper ----------------
function kpi(label, value, emoji, tint){
  return `<div class="kpi"><div class="icon" style="background:${tint}">${emoji}</div>
    <div><div class="value">${value}</div><div class="label">${label}</div></div></div>`;
}

// ---------------- Admin overview ----------------
function adminOverviewHTML(){
  const totalCopies = books.reduce((s,b)=>s+b.copies,0);
  const issued = books.reduce((s,b)=>s+(b.copies-b.available),0);
  return `
    <h2 class="page-title">Overview</h2>
    <div class="kpis">
      ${kpi("Titles in catalog", books.length, "📖", "var(--accent-soft)")}
      ${kpi("Total copies", totalCopies, "🏛️", "var(--gold-soft)")}
      ${kpi("Currently issued", issued, "🔁", "var(--blue-soft)")}
      ${kpi("Registered members", 214, "👥", "var(--red-soft)")}
    </div>
    <div class="card">
      <h3>Books issued this week</h3>
      <canvas id="trendChart" width="900" height="220"></canvas>
    </div>`;
}

function drawTrendChart(){
  const c = document.getElementById("trendChart");
  if (!c) return;
  const ctx = c.getContext("2d");
  const w = c.width, h = c.height, pad = 30;
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...trend.map(t=>t[1])) * 1.2;
  const barW = (w - pad*2) / trend.length * 0.55;
  const gap = (w - pad*2) / trend.length;
  ctx.strokeStyle = "#E4E6DE"; ctx.lineWidth = 1;
  for (let i=0;i<=4;i++){
    const y = pad + (h-pad*2) * (i/4);
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-pad,y); ctx.stroke();
  }
  trend.forEach((t,i)=>{
    const x = pad + i*gap + (gap-barW)/2;
    const barH = (h-pad*2) * (t[1]/max);
    const y = h - pad - barH;
    ctx.fillStyle = "#0F6E56";
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, [5,5,0,0]);
    ctx.fill();
    ctx.fillStyle = "#5B6158";
    ctx.font = "12px -apple-system, Arial";
    ctx.textAlign = "center";
    ctx.fillText(t[0], x+barW/2, h-10);
  });
}

// ---------------- Librarian overview ----------------
function librarianOverviewHTML(){
  const zeroStock = books.filter(b=>b.available===0).length;
  return `
    <h2 class="page-title">Overview</h2>
    <div class="kpis">
      ${kpi("Due today", 6, "⏰", "var(--gold-soft)")}
      ${kpi("Pending returns", 9, "🔁", "var(--blue-soft)")}
      ${kpi("Overdue books", overdueList.length, "⚠️", "var(--red-soft)")}
      ${kpi("Zero-stock titles", zeroStock, "📕", "var(--accent-soft)")}
    </div>
    <div class="card">
      <h3>Overdue books</h3>
      <table>
        <thead><tr><th>Member</th><th>Book</th><th>Due date</th><th>Overdue by</th></tr></thead>
        <tbody>
          ${overdueList.map(o=>`<tr>
            <td>${esc(o.member)}</td>
            <td style="color:var(--sub)">${esc(o.book)}</td>
            <td style="color:var(--sub)">${o.due}</td>
            <td><span class="badge danger">${o.days} days</span></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

// ---------------- Student overview ----------------
function studentOverviewHTML(){
  return `
    <h2 class="page-title">Your library</h2>
    <div class="kpis">
      ${kpi("Books borrowed", myLoans.length, "📖", "var(--accent-soft)")}
      ${kpi("Fines due", "₹0", "🧾", "var(--gold-soft)")}
    </div>
    <div class="card">
      <h3>Currently borrowed</h3>
      ${myLoans.map(l=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)">
          <div style="font-weight:600;font-size:13.5px">${esc(l.title)}</div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12.5px;color:var(--sub)">Due ${l.due}</span>
            <span class="badge ${l.status==='overdue'?'danger':'ok'}">${l.status==='overdue'?'Overdue':'On time'}</span>
          </div>
        </div>`).join("")}
    </div>`;
}

// ---------------- Coming soon ----------------
function comingSoonHTML(label){
  return `<div class="card empty-state">
    <div class="title">${esc(label)}</div>
    <div class="body">This section isn't wired up in the prototype yet.</div>
  </div>`;
}

// ---------------- Catalog ----------------
function catalogHTML(){
  const canManage = state.role !== "student";
  const categories = ["All", ...new Set(books.map(b=>b.category))];
  const filtered = books.filter(b=>{
    const q = state.query.toLowerCase();
    const matchesQ = (b.title+b.author+b.isbn).toLowerCase().includes(q);
    const matchesC = state.category==="All" || b.category===state.category;
    return matchesQ && matchesC;
  });

  const rows = filtered.map(b => `
    <tr>
      <td><div class="cover" style="background:${b.cover}">${initials(b.title)}</div></td>
      <td><div class="book-title">${esc(b.title)}</div><div class="book-author">${esc(b.author)}</div></td>
      <td style="color:var(--sub)">${esc(b.category)}</td>
      <td class="isbn">${esc(b.isbn)}</td>
      <td>${b.available>0
        ? `<span class="badge ok">${b.available} of ${b.copies} available</span>`
        : `<span class="badge danger">Fully issued</span>`}</td>
      <td class="row-actions">
        ${canManage
          ? `<button class="icon-btn edit" onclick="openEditModal(${b.id})">✏️</button>
             <button class="icon-btn del" onclick="openDeleteModal(${b.id})">🗑️</button>`
          : `<button class="reserve-btn ${b.available>0?'enabled':'disabled'}"
               ${b.available>0?`onclick="reserveBook(${b.id})"`:"disabled"}>
               ${b.available>0?"Reserve":"Notify me"}
             </button>`}
      </td>
    </tr>`).join("");

  return `
    <div class="catalog-toolbar">
      <div>
        <h2 class="page-title" style="margin-bottom:0">Catalog</h2>
        <p class="subtle">${filtered.length} of ${books.length} titles</p>
      </div>
      ${canManage ? `<button class="btn-primary" onclick="openAddModal()">＋ Add book</button>` : ""}
    </div>
    <div class="filters">
      <div class="search-box">
        <span>🔎</span>
        <input id="searchInput" placeholder="Search by title, author, or ISBN" value="${esc(state.query)}" />
      </div>
      <select class="cat-filter" id="categoryFilter">
        ${categories.map(c=>`<option ${c===state.category?"selected":""}>${esc(c)}</option>`).join("")}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr><th></th><th>Title</th><th>Category</th><th>ISBN</th><th>Availability</th><th></th></tr></thead>
        <tbody>
          ${rows || `<tr class="empty-row"><td colspan="6">No books match your search.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function attachCatalogEvents(){
  const si = document.getElementById("searchInput");
  if (si) si.addEventListener("input", e=>{ state.query = e.target.value; renderMain(); si.focus(); si.setSelectionRange(si.value.length, si.value.length); });
  const cf = document.getElementById("categoryFilter");
  if (cf) cf.addEventListener("change", e=>{ state.category = e.target.value; renderMain(); });
}

function reserveBook(id){
  const b = books.find(x=>x.id===id);
  if (!b || b.available<=0) return;
  b.available -= 1;
  showToast(`Reserved "${b.title}"`);
  renderMain();
}

// ---------------- Modals ----------------
function openAddModal(){ state.editingBook = null; renderModal("form"); }
function openEditModal(id){ state.editingBook = books.find(b=>b.id===id); renderModal("form"); }
function openDeleteModal(id){ state.deletingBook = books.find(b=>b.id===id); renderModal("delete"); }
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; state.editingBook=null; state.deletingBook=null; }

function renderModal(type){
  const root = document.getElementById("modalRoot");
  if (type === "form"){
    const b = state.editingBook || { title:"", author:"", isbn:"", category:"", copies:1, available:1 };
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
          <div class="modal-head">
            <h3>${state.editingBook ? "Edit book" : "Add new book"}</h3>
            <button class="close" onclick="closeModal()">✕</button>
          </div>
          <div class="field"><label>Title</label><input id="f_title" value="${esc(b.title)}"/></div>
          <div class="field"><label>Author</label><input id="f_author" value="${esc(b.author)}"/></div>
          <div class="field"><label>ISBN</label><input id="f_isbn" value="${esc(b.isbn)}"/></div>
          <div class="field"><label>Category</label><input id="f_category" value="${esc(b.category)}"/></div>
          <div class="field-row">
            <div class="field"><label>Total copies</label><input id="f_copies" type="number" min="0" value="${b.copies}"/></div>
            <div class="field"><label>Available now</label><input id="f_available" type="number" min="0" value="${b.available}"/></div>
          </div>
          <div id="formError"></div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-confirm" onclick="saveBook()">✓ Save</button>
          </div>
        </div>
      </div>`;
  } else {
    const b = state.deletingBook;
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal small">
          <h3 style="margin:0 0 8px;font-family:var(--display);font-size:18px">Remove this book?</h3>
          <p style="margin:0 0 20px;font-size:13.5px;color:var(--sub);line-height:1.5">
            "${esc(b.title)}" will be permanently removed from the catalog.</p>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-danger" onclick="confirmDelete()">Delete</button>
          </div>
        </div>
      </div>`;
  }
}

function saveBook(){
  const title = document.getElementById("f_title").value.trim();
  const author = document.getElementById("f_author").value.trim();
  const isbn = document.getElementById("f_isbn").value.trim();
  const category = document.getElementById("f_category").value.trim();
  const copies = Number(document.getElementById("f_copies").value) || 0;
  const available = Number(document.getElementById("f_available").value) || 0;

  if (!title || !author || !isbn){
    document.getElementById("formError").innerHTML = `<div class="error-text">Title, author, and ISBN are required.</div>`;
    return;
  }

  if (state.editingBook){
    const b = books.find(x=>x.id===state.editingBook.id);
    Object.assign(b, { title, author, isbn, category, copies, available });
    showToast("Book updated");
  } else {
    books.unshift({ id: Date.now(), title, author, isbn, category, copies, available, cover:"#0F6E56" });
    showToast("Book added to catalog");
  }
  closeModal();
  renderMain();
}

function confirmDelete(){
  books = books.filter(b=>b.id !== state.deletingBook.id);
  showToast("Book removed");
  closeModal();
  renderMain();
}

// ---------------- Init ----------------
renderAll();
</script>
</body>
</html>
